name: Build System Black theme package
on:
  push:
    branches: [main]
    paths:
      - "themes/system-black/js/index.ts"
      - "themes/system-black/manifest.json"
      - ".github/workflows/build-system-black.yml"
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build 1.0.1 ZIP and update repository index
        run: |
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path

          root = Path(".")
          theme = root / "themes/system-black"
          manifest_path = theme / "manifest.json"
          manifest = json.loads(manifest_path.read_text())
          version = manifest["version"]
          assert version == "1.0.1", f"Expected 1.0.1, got {version}"

          # The theme source is plain JavaScript syntax stored as .ts; package it
          # as the script path declared by the manifest.
          script_name = manifest["dist"]["script"]
          script_source = theme / "js/index.ts"
          output = root / "pool" / f'{manifest["id"]}@{version}.zip'
          output.parent.mkdir(parents=True, exist_ok=True)

          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED) as archive:
              archive.writestr("manifest.json", manifest_path.read_bytes())
              archive.writestr(script_name, script_source.read_bytes())

          data = output.read_bytes()
          index_path = root / "index.json"
          index = json.loads(index_path.read_text())
          plugin = index["plugins"][manifest["id"]]
          plugin["name"] = manifest["name"]
          plugin["description"] = manifest["description"]
          plugin["author"] = manifest["author"]
          plugin.setdefault("versions", {})[version] = {
              "url": f'https://jumeny.github.io/valenced-plugins/pool/{manifest["id"]}@{version}.zip',
              "sha256": hashlib.sha256(data).hexdigest(),
              "size": len(data),
              "dependencies": manifest["dependencies"],
          }
          plugin.setdefault("channels", {})["latest"] = version
          index_path.write_text(json.dumps(index, indent=2) + "\n")
          print(f"Built {output} ({len(data)} bytes), SHA-256 {hashlib.sha256(data).hexdigest()}")
          PY
      - name: Commit package and index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pool index.json
          git commit -m "Release System Black theme 1.0.1" || exit 0
          git push
