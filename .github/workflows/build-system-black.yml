name: Build and publish System Black theme
on:
  push:
    branches: [main]
    paths:
      - "themes/system-black/**"
      - ".github/workflows/build-system-black.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this plugin repository
        uses: actions/checkout@v4
      - name: Check out the official Valenced build toolchain
        uses: actions/checkout@v4
        with:
          repository: Accentaro/Valenced-Plugins
          ref: 4658703b5a8fcc38b816dc448eaff87f98b4411a
          path: upstream
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare dependencies without triggering the CLI's premature prepare hook
        working-directory: upstream
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          delete p.dependencies['@valenced/plugin-cli']
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\\n')
          NODE
          npm install --ignore-scripts --legacy-peer-deps
      - name: Install the pinned official CLI source
        working-directory: upstream
        run: |
          mkdir -p node_modules/@valenced
          git clone https://github.com/Valenced/valenced-plugin-cli.git node_modules/@valenced/plugin-cli
          git -C node_modules/@valenced/plugin-cli checkout c8854005208fa29c0f56eac265fd596320a48713
      - name: Restore pinned Valenced build tools
        working-directory: upstream
        run: |
          sed -i "s/entry.endsWith('.d.ts')/entry.endsWith('.d.ts') || entry.endsWith('.json')/" scripts/prepare-tools.mjs
          npm run prepare:tools
      - name: Compile and package System Black using the official CLI
        run: |
          rm -rf upstream/themes/system-black
          cp -R themes/system-black upstream/themes/system-black
          cd upstream
          npm run package
          mkdir -p ../pool
          cp "build/dist/mylloon.theme.system-black@1.0.1.zip" "../pool/mylloon.theme.system-black@1.0.1.zip"
      - name: Validate ZIP contents and update index digest
        run: |
          python3 - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          package_path = Path("pool/mylloon.theme.system-black@1.0.1.zip")
          with zipfile.ZipFile(package_path) as z:
              names = set(z.namelist())
              assert "manifest.json" in names, names
              assert "index.js" in names, names
              source = z.read("index.js").decode("utf-8")
              assert "export default" not in source, "Bundle still contains uncompiled TypeScript"
              manifest = json.loads(z.read("manifest.json"))
              assert manifest["version"] == "1.0.1", manifest
          package = package_path.read_bytes()
          path = Path("index.json")
          index = json.loads(path.read_text())
          plugin = index["plugins"]["mylloon.theme.system-black"]
          plugin["versions"]["1.0.1"] = {
              "url": "https://jumeny.github.io/valenced-plugins/pool/mylloon.theme.system-black@1.0.1.zip",
              "sha256": hashlib.sha256(package).hexdigest(),
              "size": len(package),
              "dependencies": {
                  "valenced.api": {"version": ">=1 <2"},
                  "discord": {"version": ">=352.2"},
                  "valenced.api.themes": {"version": ">=1.0.1 <2"}
              }
          }
          plugin["channels"]["latest"] = "1.0.1"
          plugin["description"] = "Mylloon's original pure-black Discord theme with updated composer and divider colours."
          path.write_text(json.dumps(index, indent=2) + chr(10))
          print("Validated compiled ZIP:", len(package), "bytes; SHA-256:", hashlib.sha256(package).hexdigest())
          PY
      - name: Commit the package and index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pool/mylloon.theme.system-black@1.0.1.zip index.json
          git commit -m "Release compiled System Black theme 1.0.1"
          git push
