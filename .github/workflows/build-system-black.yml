name: Build and publish AMOLED theme
on:
  push:
    branches: [main]
    paths:
      - "themes/system-black/**"
      - ".github/workflows/build-system-black.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: amoled-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this plugin repository
        uses: actions/checkout@v4

      - name: Check out the official Valenced build toolchain
        uses: actions/checkout@v4
        with:
          repository: Accentaro/Valenced-Plugins
          ref: 4658703b5a8fcc38b816dc448eaff87f98b4411a
          path: upstream

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare dependencies without triggering the CLI's premature prepare hook
        working-directory: upstream
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          delete p.dependencies['@valenced/plugin-cli']
          const cleanJson = JSON.stringify(p, null, 2)
          JSON.parse(cleanJson)
          fs.writeFileSync('package.json', cleanJson)
          NODE
          npm install --ignore-scripts --legacy-peer-deps
          npm install --no-save --no-package-lock --ignore-scripts --legacy-peer-deps @swc/core@^1.16.2 rolldown@^1.2.7

      - name: Install the pinned official CLI source
        working-directory: upstream
        run: |
          mkdir -p node_modules/@valenced
          git clone https://github.com/Valenced/valenced-plugin-cli.git node_modules/@valenced/plugin-cli
          git -C node_modules/@valenced/plugin-cli checkout c8854005208fa29c0f56eac265fd596320a48713

      - name: Restore pinned Valenced build tools
        working-directory: upstream
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const file = 'scripts/prepare-tools.mjs'
          const source = fs.readFileSync(file, 'utf8')
          const oldLine = "if (entry.endsWith('.d.ts') || entry === 'lib')"
          const newLine = "if (entry.endsWith('.d.ts') || entry.endsWith('.json') || entry === 'lib')"
          if (!source.includes(oldLine) && !source.includes(newLine)) {
            throw new Error('Pinned type restoration script changed; inspect before building')
          }
          fs.writeFileSync(file, source.replace(oldLine, newLine))
          NODE
          npm run prepare:tools

      - name: Compile and package AMOLED using the official CLI
        run: |
          rm -rf upstream/themes/system-black
          cp -R themes/system-black upstream/themes/system-black
          cd upstream
          npm run package
          test -s "build/dist/jmny.looks.amoled@0.0.2-alpha.zip"
          mkdir -p ../pool
          cp "build/dist/jmny.looks.amoled@0.0.2-alpha.zip" "../pool/jmny.looks.amoled@0.0.2-alpha.zip"

      - name: Validate ZIP contents and update index digest
        run: |
          python3 - <<'PY'
          import hashlib, json, re, zipfile
          from pathlib import Path

          description = "Legacy AMOLED theme, before TabsV2."
          release_version = "0.0.2-alpha"
          assert re.fullmatch(r"\d+(?:\.\d+)*(?:-[a-z0-9]+)?", release_version), release_version
          semantic_source = Path("themes/system-black/js/index.ts").read_text()
          required_black = [
              "MOBILE_ACTIONSHEET_BACKGROUND",
              "MODAL_BACKGROUND",
              "MOBILE_FLOATING_ACCESSORY_BACKGROUND",
              "MOBILE_FLOATING_ACCESSORY_BORDER",
              "MOBILE_FLOATINGBAR_BACKGROUND",
              "MOBILE_FLOATINGBAR_BACKGROUND_HIGHER",
              "MOBILE_FLOATINGBAR_BACKGROUND_NAMEPLATE",
              "USER_PROFILE_GRADIENT_BACKGROUND",
          ]
          for key in required_black:
              assert f"{key}:'#000000'" in semantic_source, f"{key} must remain pure black"
          assert not any(line.lstrip().startswith("SPINE_DEFAULT:") for line in semantic_source.splitlines()), "SPINE_DEFAULT must use Discord's default color"
          for key in ["BACKGROUND_SCRIM", "CONTEXT_MENU_BACKDROP_BACKGROUND"]:
              assert not any(line.lstrip().startswith(key + ":") for line in semantic_source.splitlines()), f"{key} must use the default blurred backdrop"
          package_path = Path("pool/jmny.looks.amoled@0.0.2-alpha.zip")
          with zipfile.ZipFile(package_path) as z:
              names = set(z.namelist())
              required = {"manifest.json", "index.js", "LICENSE", "LICENSE.rain"}
              assert required.issubset(names), (required - names)
              source = z.read("index.js").decode("utf-8")
              assert source.strip(), "Compiled entry point is empty"
              assert "export default" not in source, "Bundle still contains uncompiled TypeScript"
              manifest = json.loads(z.read("manifest.json"))
              assert manifest["version"] == release_version, manifest
              assert manifest["name"] == "AMOLED", manifest
              assert manifest["author"] == "jmny", manifest
              assert manifest["description"] == description, manifest

          package = package_path.read_bytes()
          path = Path("index.json")
          index = json.loads(path.read_text())
          assert index["name"] == "jmny", index["name"]
          plugin = {
              "name": "AMOLED",
              "description": description,
              "author": "jmny",
              "channels": {"latest": release_version},
              "versions": {}
          }
          plugin["name"] = "AMOLED"
          plugin["description"] = description
          plugin["versions"][release_version] = {
              "url": "https://jumeny.github.io/valenced-plugins/pool/jmny.looks.amoled@0.0.2-alpha.zip",
              "sha256": hashlib.sha256(package).hexdigest(),
              "size": len(package),
              "dependencies": {
                  "valenced.api": {"version": ">=1 <2"},
                  "discord": {"version": ">=352.2"},
                  "valenced.api.themes": {"version": ">=1.0.1 <2"}
              }
          }
          plugin["channels"]["latest"] = release_version
          index["plugins"] = {"jmny.looks.amoled": plugin}
          path.write_text(json.dumps(index, indent=2) + "\n")
          print("Validated AMOLED ZIP:", len(package), "bytes; SHA-256:", hashlib.sha256(package).hexdigest())
          PY

      - name: Commit the validated package and index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch pool/jmny.looks.amoled@0.0.1a.zip
          git add pool/jmny.looks.amoled@0.0.2-alpha.zip index.json
          git commit -m "Release AMOLED theme 0.0.2-alpha"
          git push

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the repository site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy the updated repository to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
